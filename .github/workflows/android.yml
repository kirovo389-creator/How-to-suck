name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64
          sudo mv godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q templates.tpz -d template-unpack
          cp -r template-unpack/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Install Android build template
        run: godot --headless --editor --path . --quit --install-android-build-template
      - name: Configure Android export paths and debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$RUNNER_TEMP"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/HowToSuck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: How-to-Suck-Android-APK
          path: build/HowToSuck.apk
          if-no-files-found: error
          retention-days: 14
