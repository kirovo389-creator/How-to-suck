name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate project files
        run: python3 tools/validate_project.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64
          sudo mv godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q templates.tpz -d template-unpack
          cp -r template-unpack/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Install Android build template
        run: godot --headless --editor --path . --quit --install-android-build-template
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Run headless game smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --audio-driver Dummy --path . --quit-after 120 2>&1 | tee game-smoke-test.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Attempt to call function .* on a null instance" game-smoke-test.log; then
            echo "Godot reported a runtime or script error."
            exit 1
          fi
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/HowToSuck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: How-to-Suck-Android-APK
          path: build/HowToSuck.apk
          if-no-files-found: error
          retention-days: 14
